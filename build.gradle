        if (rootProject.target == "legacy-fabric") {
            implementation("com.google.guava:guava:12.0.1")
        }
        implementation("fmllibs:argo:2.25")

        modImplementation("com.github.thecatcore.CursedMixinExtensions:fabric:1.0.0") {
            exclude(module: 'fabric-loader')
        }
        // Published version of MRAPI
        modImplementation("maven.modrinth:mod-remapping-api:${project.mod_remapping_api}")

//        // Local version of MRAPI
//        modImplementation("io.github.fabriccompatibilitylayers:mod-remapping-api:1.30.0")

//        modImplementation(fabricApi.legacyFabricModule("legacy-fabric-logger-api-v1", "${project.legacyfabric_version}+${project.minecraft_version}")) {
//            exclude(module: 'fabric-loader')
//        }
        modImplementation("maven.modrinth:spasm:0.2")

        modImplementation("com.github.thecatcore:WFVAIO:1.2.1") {
            exclude(module: 'fabric-loader')
        }

        modImplementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0"))
        implementation("net.ornithemc:conditional-mixin:1.0.0-beta.2")

        ornitheLibraries.forEach {
            implementation(it)
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    processResources {
        def proj = project
        inputs.property "version", proj.version
        inputs.property "fabric_loader_version", proj.fabric_loader_version
        inputs.property "mc_version", proj.minecraft_version
        inputs.property "mrapi_version", proj.mod_remapping_api
        inputs.property "osl_version", proj.osl_version
        inputs.property "flf_mappings", provider { buildFlfMappingsJson(proj) }

        filesMatching("fabric.mod.json") {
            expand "version": proj.version,
                    "fabric_loader_version": rootProject.fabric_loader_version,
                    "mc_version": rootProject.minecraft_version,
                    "mrapi_version": rootProject.mod_remapping_api,
                    "osl_version": proj.osl_version,
                    "flf_mappings": buildFlfMappingsJson(proj)
        }
    }

    spotless {
        java {
            licenseHeaderFile(rootProject.file("HEADER"))
            lineEndings = LineEnding.UNIX
            removeUnusedImports()
            trimTrailingWhitespace()
            target 'src/*/java/io/github/fabriccompatibilitylayers/**/*.java'
        }
    }

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${base.archivesName.get()}" }
        }
        from(rootProject.file("licensing.md"))
    }

    tasks.withType(JavaCompile) {
        options.deprecation = true
    }
}

unimined.minecraft {
}

subprojects.forEach {
    remapJar.dependsOn("${it.path}:remapJar")
}

dependencies {
    include("fmllibs:argo:2.25")
    include("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0")
    include("net.ornithemc:conditional-mixin:1.0.0-beta.2")

    afterEvaluate {
        subprojects.forEach {
            include(project(path: "${it.path}", configuration: 'production'))
        }
    }
}