plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT' apply false
}

group project.maven_group

base {
    archivesName = project.archives_base_name
}

def ornitheLibraries = [
        "com.google.code.gson:gson:2.10",
        "commons-codec:commons-codec:1.9",
        "commons-io:commons-io:2.4",
        "commons-logging:commons-logging:1.1.3",
        "it.unimi.dsi:fastutil:8.5.9",
        "net.ornithemc:logger-config:1.0.0",
        "org.apache.commons:commons-compress:1.8.1",
        "org.apache.commons:commons-lang3:3.1",
        "org.apache.httpcomponents:httpclient:4.3.3",
        "org.apache.httpcomponents:httpcore:4.3.2",
        "org.apache.logging.log4j:log4j-api:2.19.0",
        "org.apache.logging.log4j:log4j-core:2.19.0",
        "org.apache.logging.log4j:log4j-slf4j2-impl:2.19.0",
        "org.slf4j:slf4j-api:2.0.1"
]

allprojects {
    apply(plugin: "xyz.wagyourtail.unimined")

    version project.version

    unimined.useGlobalCache = false

    unimined.neoForgedMaven()
    unimined.ornitheMaven()
    unimined.quiltMaven()
    unimined.modrinthMaven()
    unimined.jitpack()

    repositories {
        ivy {
            name = "fmllibs"
            url = "https://maven.wagyourtail.xyz/releases/fmllibs/"
            patternLayout {
                artifact("[artifact]-[revision].[ext]")
            }
            content {
                includeGroup("fmllibs")
            }
            metadataSources {
                it.artifact()
            }
        }
        maven { url = "https://maven.bawnorton.com/releases" }
        maven {
            url = "https://jvmdowngrader.wagyourtail.xyz/maven/"
        }

        mavenLocal()
    }

    configurations {
        ornitheImplementation
        modImplementation.extendsFrom ornitheImplementation
    }

    unimined.minecraft(sourceSets.main, true) {
        version project.minecraft_version

        mappings {
            calamus()

            forgeBuiltinMCP(project.forge_version)

            stubs(["official", "searge", "calamus", "legacyIntermediary", "forgeMCP"]) {
                k("", "net/minecraft/src/", "net/minecraft/unmapped/", "net/minecraft/", "net/minecraft/src/")
                c("BaseMod", "net/minecraft/src/BaseMod", "net/minecraft/unmapped/BaseMod", "net/minecraft/BaseMod", "net/minecraft/src/BaseMod")
                c("EntityRendererProxy", "net/minecraft/src/EntityRendererProxy", "net/minecraft/unmapped/EntityRendererProxy", "net/minecraft/EntityRendererProxy", "net/minecraft/src/EntityRendererProxy")
                c("FMLRenderAccessLibrary", "net/minecraft/src/FMLRenderAccessLibrary", "net/minecraft/unmapped/FMLRenderAccessLibrary", "net/minecraft/FMLRenderAccessLibrary", "net/minecraft/src/FMLRenderAccessLibrary")
                c("MLProp", "net/minecraft/src/MLProp", "net/minecraft/unmapped/MLProp", "net/minecraft/MLProp", "net/minecraft/src/MLProp")
                c("ModLoader", "net/minecraft/src/ModLoader", "net/minecraft/unmapped/ModLoader", "net/minecraft/ModLoader", "net/minecraft/src/ModLoader")
                c("ModTextureAnimation", "net/minecraft/src/ModTextureAnimation", "net/minecraft/unmapped/ModTextureAnimation", "net/minecraft/ModTextureAnimation", "net/minecraft/src/ModTextureAnimation")
                c("ModTextureStatic", "net/minecraft/src/ModTextureStatic", "net/minecraft/unmapped/ModTextureStatic", "net/minecraft/ModTextureStatic", "net/minecraft/src/ModTextureStatic")
                c("TradeEntry", "net/minecraft/src/TradeEntry", "net/minecraft/unmapped/TradeEntry", "net/minecraft/TradeEntry", "net/minecraft/src/TradeEntry")

                c("ala", "relocated/argo/format/CompactJsonFormatter", "net/minecraft/unmapped/C_9199292", "net/minecraft/class_270", "relocated/argo/format/CompactJsonFormatter")
                c("alb", "relocated/argo/format/CompactJsonFormatter_JsonNodeType", "net/minecraft/unmapped/C_9994818", "net/minecraft/class_271", "relocated/argo/format/CompactJsonFormatter_JsonNodeType")
                c("alc", "relocated/argo/format/JsonEscapedString", "net/minecraft/unmapped/C_9126296", "net/minecraft/class_272", "relocated/argo/format/JsonEscapedString")
                c("ald", "relocated/argo/format/JsonFormatter", "net/minecraft/unmapped/C_5014293", "net/minecraft/class_273", "relocated/argo/format/JsonFormatter")
                c("ale", "relocated/argo/jdom/ChainedFunctor", "net/minecraft/unmapped/C_0979244", "net/minecraft/class_274", "relocated/argo/jdom/ChainedFunctor")
                c("alf", "relocated/argo/jdom/Functor", "net/minecraft/unmapped/C_1043464", "net/minecraft/class_275", "relocated/argo/jdom/Functor")
                c("alg", "relocated/argo/jdom/JdomParser", "net/minecraft/unmapped/C_7785042", "net/minecraft/class_276", "relocated/argo/jdom/JdomParser")
                c("alh", "relocated/argo/jdom/JsonArray", "net/minecraft/unmapped/C_9017637", "net/minecraft/class_277", "relocated/argo/jdom/JsonArray")
                c("ali", "relocated/argo/jdom/JsonArray_NodeList", "net/minecraft/unmapped/C_5870653", "net/minecraft/class_278", "relocated/argo/jdom/JsonArray_NodeList")
                c("alj", "relocated/argo/jdom/JsonArrayNodeBuilder", "net/minecraft/unmapped/C_6674744", "net/minecraft/class_279", "relocated/argo/jdom/JsonArrayNodeBuilder")
                c("alk", "relocated/argo/jdom/JsonConstants", "net/minecraft/unmapped/C_1466821", "net/minecraft/class_280", "relocated/argo/jdom/JsonConstants")
                c("all", "relocated/argo/jdom/JsonFieldBuilder", "net/minecraft/unmapped/C_0704537", "net/minecraft/class_281", "relocated/argo/jdom/JsonFieldBuilder")
                c("alm", "relocated/argo/jdom/JsonListenerToJdomAdapter", "net/minecraft/unmapped/C_1390297", "net/minecraft/class_282", "relocated/argo/jdom/JsonListenerToJdomAdapter")
                c("aln", "relocated/argo/jdom/JsonListenerToJdomAdapter_Array", "net/minecraft/unmapped/C_9344203", "net/minecraft/class_283", "relocated/argo/jdom/JsonListenerToJdomAdapter_Array")
                c("alo", "relocated/argo/jdom/JsonListenerToJdomAdapter_Object", "net/minecraft/unmapped/C_0107612", "net/minecraft/class_284", "relocated/argo/jdom/JsonListenerToJdomAdapter_Object")
                c("alp", "relocated/argo/jdom/JsonListenerToJdomAdapter_Field", "net/minecraft/unmapped/C_1274722", "net/minecraft/class_285", "relocated/argo/jdom/JsonListenerToJdomAdapter_Field")
                c("alq", "relocated/argo/jdom/JsonListenerToJdomAdapter_NodeContainer", "net/minecraft/unmapped/C_6205130", "net/minecraft/class_286", "relocated/argo/jdom/JsonListenerToJdomAdapter_NodeContainer")
                c("alr", "relocated/argo/jdom/JsonNode", "net/minecraft/unmapped/C_0304196", "net/minecraft/class_287", "relocated/argo/jdom/JsonNode")
                c("als", "relocated/argo/jdom/JsonNodeBuilder", "net/minecraft/unmapped/C_0087465", "net/minecraft/class_288", "relocated/argo/jdom/JsonNodeBuilder")
                c("alt", "relocated/argo/jdom/JsonNodeBuilders", "net/minecraft/unmapped/C_8313918", "net/minecraft/class_289", "relocated/argo/jdom/JsonNodeBuilders")
                c("alu", "relocated/argo/jdom/JsonNodeBuilders_Null", "net/minecraft/unmapped/C_0564609", "net/minecraft/class_290", "relocated/argo/jdom/JsonNodeBuilders_Null")
                c("alv", "relocated/argo/jdom/JsonNodeBuilders_True", "net/minecraft/unmapped/C_8269353", "net/minecraft/class_291", "relocated/argo/jdom/JsonNodeBuilders_True")
                c("alw", "relocated/argo/jdom/JsonNodeBuilders_False", "net/minecraft/unmapped/C_6065941", "net/minecraft/class_292", "relocated/argo/jdom/JsonNodeBuilders_False")
                c("alx", "relocated/argo/jdom/JsonNodeDoesNotMatchChainedJsonNodeSelectorException", "net/minecraft/unmapped/C_1783083", "net/minecraft/class_293", "relocated/argo/jdom/JsonNodeDoesNotMatchChainedJsonNodeSelectorException")
                c("aly", "relocated/argo/jdom/JsonNodeDoesNotMatchJsonNodeSelectorException", "net/minecraft/unmapped/C_2454420", "net/minecraft/class_294", "relocated/argo/jdom/JsonNodeDoesNotMatchJsonNodeSelectorException")
                c("alz", "relocated/argo/jdom/JsonNodeDoesNotMatchPathElementsException", "net/minecraft/unmapped/C_9291467", "net/minecraft/class_295", "relocated/argo/jdom/JsonNodeDoesNotMatchPathElementsException")
                c("ama", "relocated/argo/jdom/JsonNodeFactories", "net/minecraft/unmapped/C_4249662", "net/minecraft/class_297", "relocated/argo/jdom/JsonNodeFactories")
                c("amb", "relocated/argo/jdom/JsonNodeSelector", "net/minecraft/unmapped/C_6263676", "net/minecraft/class_298", "relocated/argo/jdom/JsonNodeSelector")
                c("amc", "relocated/argo/jdom/JsonNodeSelectors", "net/minecraft/unmapped/C_0632194", "net/minecraft/class_299", "relocated/argo/jdom/JsonNodeSelectors")
                c("amd", "relocated/argo/jdom/JsonNodeSelectors_String", "net/minecraft/unmapped/C_8179293", "net/minecraft/class_300", "relocated/argo/jdom/JsonNodeSelectors_String")
                c("ame", "relocated/argo/jdom/JsonNodeSelectors_Object", "net/minecraft/unmapped/C_4323228", "net/minecraft/class_301", "relocated/argo/jdom/JsonNodeSelectors_Object")
                c("amf", "relocated/argo/jdom/JsonNodeSelectors_Field", "net/minecraft/unmapped/C_8644429", "net/minecraft/class_302", "relocated/argo/jdom/JsonNodeSelectors_Field")
                c("amg", "relocated/argo/jdom/JsonNodeSelectors_Element", "net/minecraft/unmapped/C_2452333", "net/minecraft/class_303", "relocated/argo/jdom/JsonNodeSelectors_Element")
                c("amh", "relocated/argo/jdom/JsonNodeSelectors_Array", "net/minecraft/unmapped/C_9418795", "net/minecraft/class_304", "relocated/argo/jdom/JsonNodeSelectors_Array")
                c("ami", "relocated/argo/jdom/JsonNodeType", "net/minecraft/unmapped/C_9003983", "net/minecraft/class_305", "relocated/argo/jdom/JsonNodeType")
                c("amj", "relocated/argo/jdom/JsonNumberNode", "net/minecraft/unmapped/C_8487891", "net/minecraft/class_306", "relocated/argo/jdom/JsonNumberNode")
                c("amk", "relocated/argo/jdom/JsonNumberNodeBuilder", "net/minecraft/unmapped/C_0451770", "net/minecraft/class_307", "relocated/argo/jdom/JsonNumberNodeBuilder")
                c("aml", "relocated/argo/jdom/JsonObject", "net/minecraft/unmapped/C_2107089", "net/minecraft/class_308", "relocated/argo/jdom/JsonObject")
                c("amm", "relocated/argo/jdom/JsonObjectNodeBuilder", "net/minecraft/unmapped/C_7458519", "net/minecraft/class_309", "relocated/argo/jdom/JsonObjectNodeBuilder")
                c("amn", "relocated/argo/jdom/JsonObjectNodeBuilder_List", "net/minecraft/unmapped/C_9955391", "net/minecraft/class_310", "relocated/argo/jdom/JsonObjectNodeBuilder_List")
                c("amo", "relocated/argo/jdom/JsonRootNode", "net/minecraft/unmapped/C_6558469", "net/minecraft/class_311", "relocated/argo/jdom/JsonRootNode")
                c("amp", "relocated/argo/jdom/JsonStringNode", "net/minecraft/unmapped/C_8781664", "net/minecraft/class_312", "relocated/argo/jdom/JsonStringNode")
                c("amq", "relocated/argo/jdom/JsonStringNodeBuilder", "net/minecraft/unmapped/C_7729099", "net/minecraft/class_313", "relocated/argo/jdom/JsonStringNodeBuilder")
                c("amr", "relocated/argo/jdom/LeafFunctor", "net/minecraft/unmapped/C_0802959", "net/minecraft/class_314", "relocated/argo/jdom/LeafFunctor")
                c("ams", "relocated/argo/saj/InvalidSyntaxException", "net/minecraft/unmapped/C_2116274", "net/minecraft/class_315", "relocated/argo/saj/InvalidSyntaxException")
                c("amt", "relocated/argo/saj/JsonListener", "net/minecraft/unmapped/C_7604698", "net/minecraft/class_316", "relocated/argo/saj/JsonListener")
                c("amu", "relocated/argo/saj/PositionTrackingPushbackReader", "net/minecraft/unmapped/C_4184259", "net/minecraft/class_317", "relocated/argo/saj/PositionTrackingPushbackReader")
                c("amv", "relocated/argo/saj/SajParser", "net/minecraft/unmapped/C_2752037", "net/minecraft/class_318", "relocated/argo/saj/SajParser")
                c("amw", "relocated/argo/saj/ThingWithPosition", "net/minecraft/unmapped/C_0514978", "net/minecraft/class_319", "relocated/argo/saj/ThingWithPosition")
            }
        }

        legacyFabric {
            loader project.fabric_version

            if (project.hasProperty("access_widener") && !project.access_widener.isEmpty()) {
                accessWidener(project.file(project.access_widener))
//                afterEvaluate {
//                    mergeAws([
//                            atLegacy2aw(project.file(project.access_transformer), project.file("converted_at.accesswidener"), "official"),
//                            project.file("fabric-specific.accesswidener")
//                    ], project.mappings)
//                }
            }
        }

        runs {
            config("client") {
                jvmArgs += "-Dfabric-mod-remapper-api.dev"
            }
            config("server") {
                jvmArgs += "-Dfabric-mod-remapper-api.dev"
            }
        }

        minecraftRemapper.config {
            ignoreFieldDesc(true)
        }

        mods {
            modImplementation {
                mixinRemap {
                    enableBaseMixin()
                    enableMixinExtra()
                }
            }

            remap(configurations.ornitheImplementation) {
                namespace("calamus")

                mixinRemap {
                    enableBaseMixin()
                    enableMixinExtra()
                }
            }
        }
    }

    dependencies {
        implementation("com.google.guava:guava:12.0.1")
        implementation("fmllibs:argo:2.25")

        modImplementation("com.github.thecatcore.CursedMixinExtensions:fabric:1.0.0") {
            exclude(module: 'fabric-loader')
        }
        // Published version of MRAPI
        modImplementation("maven.modrinth:mod-remapping-api:${project.mod_remapping_api}")

//        // Local version of MRAPI
//        modImplementation("io.github.fabriccompatibilitylayers:mod-remapping-api:1.27.0")

//        modImplementation(fabricApi.legacyFabricModule("legacy-fabric-logger-api-v1", "${project.legacyfabric_version}+${project.minecraft_version}")) {
//            exclude(module: 'fabric-loader')
//        }
        modImplementation(fabricApi.legacyFabric("${project.legacyfabric_version}+${project.minecraft_version}")) {
            exclude(module: 'fabric-loader')
        }
        modImplementation("maven.modrinth:spasm:0.2")

        modImplementation("com.github.thecatcore:WFVAIO:1.2.1") {
            exclude(module: 'fabric-loader')
        }

        modImplementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0"))
        implementation("jvmdg-8.com.moulberry:mixinconstraints:1.0.9")

        fabricApi.osl(project.minecraft_version, project.osl_version).forEach {
            ornitheImplementation(it)
        }

        ornitheImplementation("com.terraformersmc:modmenu:${project.modmenu_version}+mc${project.minecraft_version}")

        ornitheLibraries.forEach {
            runtimeOnly(it)
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "mc_version", project.minecraft_version
        inputs.property "mrapi_version", project.mod_remapping_api

        filesMatching("fabric.mod.json") {
            expand "version": project.version,
                    "mc_version": rootProject.minecraft_version,
                    "mrapi_version": project.mod_remapping_api
        }
    }
}

unimined.minecraft {
}

subprojects.forEach {
    remapJar.dependsOn("${it.path}:remapJar")
}

dependencies {
    include("fmllibs:argo:2.25")
    include("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.2.0")
    include("jvmdg-8.com.moulberry:mixinconstraints:1.0.9")
    include("xyz.wagyourtail.jvmdowngrader:jvmdowngrader-java-api:1.3.6:downgraded-8") {
        transitive = false
    }

    afterEvaluate {
        subprojects.forEach {
            include(project(path: "${it.path}", configuration: 'production'))
        }
    }
}