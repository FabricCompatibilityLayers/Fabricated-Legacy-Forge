                if (project.hasProperty("access_widener") && !project.access_widener.isEmpty()) {
                    accessWidener(project.file(project.access_widener))
//                afterEvaluate {
//                    mergeAws([
//                            atLegacy2aw(project.file(project.access_transformer), project.file("converted_at.accesswidener"), "official"),
//                            project.file("fabric-specific.accesswidener")
//                    ], project.mappings)
//                }
                }
            }
        } else {
            ornitheFabric {
                loader project.fabric_loader_version

                if (project.hasProperty("access_widener") && !project.access_widener.isEmpty()) {
                    accessWidener(project.file(project.access_widener))
//                afterEvaluate {
//                    mergeAws([
//                            atLegacy2aw(project.file(project.access_transformer), project.file("converted_at.accesswidener"), "official"),
//                            project.file("fabric-specific.accesswidener")
//                    ], project.mappings)
//                }
                }
            }
        }

        runs {
            config("client") {
                jvmArgs += "-Dfabric-mod-remapper-api.dev"
            }
            config("server") {
                jvmArgs += "-Dfabric-mod-remapper-api.dev"
            }
        }

        minecraftRemapper.config {
            ignoreFieldDesc(true)
        }

        mods {
            modImplementation {
                mixinRemap {
                    enableBaseMixin()
                    enableMixinExtra()
                }
            }

            if (rootProject.target == "legacy-fabric") {
                remap(configurations.ornitheImplementation) {
                    namespace("calamus")

                    mixinRemap {
                        enableBaseMixin()
                        enableMixinExtra()
                    }
                }
            }

            remap(configurations.mcpImplementation) {
                namespace("official")
            }

            remap(configurations.mcpAtImplementation) {
                namespace("official")
                remapAtToLegacy = true
            }
        }
