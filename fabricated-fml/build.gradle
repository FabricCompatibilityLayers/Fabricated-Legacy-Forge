unimined.minecraft {
    mappings {
        devNamespace("searge")
    }
}

configurations {
    production
}

artifacts {
    production remapJar
}

remapJar {
    remapAccessTransformer.set(false)

    mixinRemap {
        enableBaseMixin()
        enableMixinExtra()
    }
}

import com.diffplug.gradle.spotless.JavaExtension

spotless {
    format("fml", JavaExtension) {
        licenseHeaderFile(file("FML_HEADER"))
        target 'src/*/java/cpw/mods/fml/**/*.java', 'src/*/java/net/minecraft/src/**/*.java'
    }
}

jar {
    from("LICENSE-fml.txt")
    from("CREDITS-fml.txt")
}